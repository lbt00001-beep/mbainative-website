<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Alumnos · Aprende IA en sesiones de 20 minutos</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2430;--paper:#FBF8F1;--muted:#5B6170;--line:#E4DED2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px}
.menubar{position:sticky;top:0;display:flex;align-items:center;gap:2px;height:38px;padding:0 8px;background:#F3F1EB;border-bottom:1px solid #D9D3C6;font-size:14px;z-index:5}
.menubar b{font-family:'Bricolage Grotesque',sans-serif;padding:0 12px 0 4px}
.menu{position:relative}
.menu>button{background:none;border:0;padding:6px 10px;border-radius:4px;cursor:pointer;font:inherit}
.menu>button:hover,.menu.open>button{background:#E2DED4}
.drop{position:absolute;top:34px;left:0;min-width:230px;background:#fff;border:1px solid #CFC8BA;border-radius:6px;box-shadow:0 8px 24px rgba(30,36,48,.16);padding:4px;display:none}
.menu.open .drop{display:block}
.drop button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 12px;border-radius:4px;cursor:pointer;font:inherit}
.drop button:hover{background:#EEF1F7}
.drop button:disabled{color:#9A9AA2;background:none;cursor:default}
.wrap{max-width:1180px;margin:0 auto;padding:32px 24px 60px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;margin:0 0 20px}
.key{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;max-width:620px}
.key label{display:flex;flex-direction:column;gap:6px;font-weight:600;flex:1;min-width:240px}
input{height:46px;border:2px solid #CFC8BA;border-radius:10px;padding:0 12px;font:inherit}
.btn{height:46px;padding:0 20px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.err{color:#B42318;font-weight:600;margin-top:10px}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
.sum div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sum b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px}
.sum span{color:var(--muted);font-size:14px}
.tbox{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
td.n,th.n{text-align:right}
.pb{display:inline-block;width:110px;height:8px;border-radius:4px;background:#ECE7DC;vertical-align:middle;margin-right:8px;overflow:hidden}
.pb i{display:block;height:100%;background:#2B59A6}
.filter{margin:0 0 12px;width:320px;max-width:100%}
.hidden{display:none!important}
@media(max-width:700px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<nav class="menubar" aria-label="Menú principal"><b>Aprende IA · Alumnos</b>
  <div class="menu"><button type="button">Archivo</button><div class="drop">
    <button type="button" data-cmd="csv" data-need="1">Descargar lista (.csv)</button>
    <button type="button" data-cmd="salir">Cerrar sesión</button></div></div>
  <div class="menu"><button type="button">Edición</button><div class="drop">
    <button type="button" data-cmd="copiar" data-need="1">Copiar emails de los alumnos</button></div></div>
  <div class="menu"><button type="button">Ajustes</button><div class="drop">
    <button type="button" data-cmd="salir">Cambiar de cuenta</button></div></div>
  <div class="menu"><button type="button">Vista</button><div class="drop">
    <button type="button" data-cmd="recargar" data-need="1">Actualizar datos</button>
    <button type="button" data-cmd="curso">Abrir el curso</button></div></div>
  <div class="menu"><button type="button">Ayuda</button><div class="drop">
    <button type="button" data-cmd="ayuda">Quién puede ver esta página</button></div></div>
</nav>
<main class="wrap">
  <h1>Alumnos del curso</h1>
  <div class="key" id="kf">
    <p style="margin:0;flex:1;min-width:240px">Entra con la cuenta de Google del responsable del curso para ver a los alumnos.</p>
    <button class="btn" type="button" id="gIn">Entrar con Google</button>
  </div>
  <div class="err" id="err" role="alert"></div>
  <section id="res" class="hidden">
    <div class="sum">
      <div><b id="sU">0</b><span>alumnos</span></div>
      <div><b id="sA">0</b><span>activos últimos 7 días</span></div>
      <div><b id="sF">0</b><span>han terminado el curso</span></div>
      <div><b id="sT">0 h</b><span>de práctica entre todos</span></div>
    </div>
    <input class="filter" id="flt" placeholder="Buscar por nombre o email" aria-label="Buscar alumno">
    <div class="tbox"><table><thead><tr>
      <th data-s="name">Nombre</th><th data-s="email">Email</th><th data-s="done">Fichas hechas</th>
      <th class="n" data-s="seconds">Tiempo</th><th class="n" data-s="active_days">Días activos</th>
      <th data-s="last_seen">Última vez</th><th data-s="created_at">Alta</th></tr></thead><tbody id="tb"></tbody></table></div>
  </section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const fb = initializeApp({"apiKey": "AIzaSyB3fb4tTthsOGAa_8o9_SyM5l_UNOKd6Fs", "authDomain": "curso-ia-20min-mbai.firebaseapp.com", "projectId": "curso-ia-20min-mbai", "storageBucket": "curso-ia-20min-mbai.firebasestorage.app", "messagingSenderId": "570735738441", "appId": "1:570735738441:web:5bca6a88d578e721878998"});
const auth = getAuth(fb); auth.languageCode = 'es';
const db = getFirestore(fb);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { const m=Math.round(s/60); return m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`; };
const ts = v => v?.toDate ? v.toDate() : (v ? new Date(v) : null);
const fdate = d => d ? d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
let rows = [], sortK = 'last_seen', sortDir = -1;
async function load(){
  $('err').textContent = '';
  try{
    const snap = await getDocs(collection(db,'users'));
    rows = snap.docs.map(d => { const u = d.data(); const f = Object.values(u.fichas||{});
      return { name:u.name, email:u.email, seconds:u.totalSeconds||0, done:f.filter(x=>x.doneAt).length,
        active_days:Object.values(u.daily||{}).filter(s=>s>=60).length, last_seen:ts(u.lastSeen), created_at:ts(u.createdAt) }; });
    $('kf').classList.add('hidden'); $('res').classList.remove('hidden');
    const wk = Date.now()-7*864e5;
    $('sU').textContent = rows.length;
    $('sA').textContent = rows.filter(u=>u.last_seen && u.last_seen>wk).length;
    $('sF').textContent = rows.filter(u=>u.done>=20).length;
    $('sT').textContent = fmt(rows.reduce((a,u)=>a+u.seconds,0));
    render(); need();
  }catch(e){
    $('err').textContent = e.code==='permission-denied' ? `La cuenta ${auth.currentUser?.email} no es la del responsable del curso.` : (e.message||'Error');
    $('kf').classList.remove('hidden'); $('res').classList.add('hidden'); rows=[]; need();
  }
}
function render(){
  const q = $('flt').value.toLowerCase();
  const list = rows.filter(u => (u.name+' '+u.email).toLowerCase().includes(q))
    .sort((a,b)=> ((a[sortK]??0)>(b[sortK]??0)?1:(a[sortK]??0)<(b[sortK]??0)?-1:0)*sortDir);
  $('tb').innerHTML = list.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td>
    <td><span class="pb"><i style="width:${u.done*5}%"></i></span>${u.done}/20</td><td class="n">${fmt(u.seconds)}</td>
    <td class="n">${u.active_days}</td><td>${fdate(u.last_seen)}</td><td>${fdate(u.created_at)}</td></tr>`).join('') ||
    '<tr><td colspan="7" style="color:#5B6170">Todavía no hay alumnos.</td></tr>';
}
function need(){ document.querySelectorAll('[data-need]').forEach(b => b.disabled = !rows.length); }
$('gIn').onclick = async () => { try { const p=new GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'}); await signInWithPopup(auth,p); } catch(e){ $('err').textContent = e.message; } };
$('flt').oninput = render;
document.querySelectorAll('th[data-s]').forEach(th => th.onclick = () => { const k=th.dataset.s; sortDir = sortK===k ? -sortDir : -1; sortK=k; render(); });
const CMD = {
  csv(){ const h=['Nombre','Email','Fichas hechas','Minutos','Días activos','Última vez','Alta'];
    const lines=[h, ...rows.map(u=>[u.name,u.email,u.done,Math.round(u.seconds/60),u.active_days,u.last_seen?.toISOString()||'',u.created_at?.toISOString()||''])]
      .map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'})); a.download='alumnos-curso-ia.csv'; a.click(); },
  async copiar(){ await navigator.clipboard.writeText(rows.map(u=>u.email).join(', ')); $('err').textContent=''; },
  async salir(){ await signOut(auth); },
  recargar(){ load(); },
  curso(){ location.href='index.html'; },
  ayuda(){ $('err').innerHTML = '<span style="color:#1E2430;font-weight:400">Solo la cuenta del responsable del curso puede ver esta lista (lo controlan las reglas de Firestore). Las notas de los alumnos son privadas y no aparecen aquí.</span>'; }
};
const menus=[...document.querySelectorAll('.menu')], close=()=>menus.forEach(m=>m.classList.remove('open'));
menus.forEach(m=>m.firstElementChild.onclick=()=>{const o=m.classList.contains('open');close();if(!o)m.classList.add('open');});
document.addEventListener('click',e=>{const c=e.target.closest('[data-cmd]'); if(c&&!c.disabled){close();CMD[c.dataset.cmd]();return;} if(!e.target.closest('.menu'))close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
onAuthStateChanged(auth, u => { if (u) load(); else { rows=[]; $('kf').classList.remove('hidden'); $('res').classList.add('hidden'); need(); } });
need();
</script>
</body>
</html>
